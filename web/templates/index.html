<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>asm2py</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1c1e21; }
  header { display: flex; gap: 16px; align-items: center; padding: 12px 20px;
           background: #1f2937; color: #fff; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header label { font-size: 14px; }
  select, button { padding: 6px 12px; font-size: 14px; border-radius: 6px; border: 0; }
  button { background: #3b82f6; color: #fff; cursor: pointer; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px;
         height: calc(100vh - 60px); }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
            margin: 0 0 6px; color: #555; }
  textarea, pre { flex: 1; margin: 0; padding: 12px; border: 1px solid #d0d4da;
                  border-radius: 8px; font: 14px/1.5 Consolas, monospace;
                  background: #fff; overflow: auto; resize: none; }
  #bottom { flex: 0 0 110px; margin-top: 10px; }
  #bottom pre { height: 100%; }
  .error { color: #b91c1c; } .warn { color: #b45309; }
</style>
</head>
<body>
<header>
  <h1>asm2py: Assembly to Python compiler</h1>
  <select id="examples"><option value="">Load example...</option></select>
  <label><input type="checkbox" id="optimize" checked> Optimize</label>
  <label><input type="checkbox" id="run" checked> Run</label>
  <button id="go">Compile</button>
</header>
<main>
  <div class="col">
    <h2>Assembly input</h2>
    <textarea id="src" spellcheck="false" placeholder="Paste assembly here..."></textarea>
  </div>
  <div class="col">
    <h2>Generated Python</h2>
    <pre id="out"></pre>
    <div id="bottom">
      <h2>Program output / messages</h2>
      <pre id="msg"></pre>
    </div>
  </div>
</main>
<script>
const EXAMPLES = {
  "Factorial of 5": "; prints 120\n    mov eax, 1\n    mov ecx, 5\nloop_start:\n    mul eax, ecx\n    dec ecx\n    cmp ecx, 0\n    jg loop_start\n    print eax\n    hlt\n",
  "Sum 1 to 5": "; prints 15\n    mov ecx, 5\n    mov eax, 0\nloop_start:\n    add eax, ecx\n    dec ecx\n    cmp ecx, 0\n    jne loop_start\n    print eax\n    hlt\n",
  "Subroutine (call/ret)": "; prints 49\n    mov eax, 7\n    call square\n    print eax\n    hlt\nsquare:\n    mul eax, eax\n    ret\n",
  "Max of two": "    mov eax, 7\n    mov ebx, 12\n    cmp eax, ebx\n    jge eax_bigger\n    print ebx\n    hlt\neax_bigger:\n    print eax\n    hlt\n"
};
const src = document.getElementById("src"), out = document.getElementById("out"),
      msg = document.getElementById("msg"), sel = document.getElementById("examples");
for (const name in EXAMPLES) sel.add(new Option(name, name));
sel.onchange = () => { if (sel.value) { src.value = EXAMPLES[sel.value]; compile(); } };

async function compile() {
  try {
    const res = await fetch("/compile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        source: src.value,
        optimize: document.getElementById("optimize").checked,
        run: document.getElementById("run").checked
      })
    });
    const d = await res.json();
    msg.textContent = ""; msg.className = "";
    if (!res.ok || !d.ok) {
      out.textContent = "";
      msg.className = "error";
      msg.textContent = "error: " + (d.error || "Compilation request failed.");
      return;
    }
    out.textContent = d.code;
    let text = "";
    if (d.warnings && d.warnings.length) text += d.warnings.map(w => "warning: " + w).join("\n") + "\n";
    text += d.output;
    msg.textContent = text;
  } catch (error) {
    out.textContent = "";
    msg.className = "error";
    msg.textContent = "error: Unable to reach the compiler.";
  }
}
document.getElementById("go").onclick = compile;
let timer;
src.oninput = () => { clearTimeout(timer); timer = setTimeout(compile, 500); };
</script>
</body>
</html>
